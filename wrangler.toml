# Optional — the worker is normally paste-deployed from the dashboard.
# This file only exists so `npx wrangler deploy` also works. Never required.
name = "millo-worker"
main = "worker.js"
compatibility_date = "2026-01-01"

kv_namespaces = [
  { binding = "MILLO_NOTES", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[[r2_buckets]]
binding = "MILLO_BUCKET"
bucket_name = "REPLACE_WITH_BUCKET_NAME"

# Secret (set once):  npx wrangler secret put MILLO_KEY
