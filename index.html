<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>MILLO — ARCHIVE</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23FF91AF'/><rect x='4' y='6' width='4' height='20' fill='%23000'/><rect x='14' y='6' width='4' height='20' fill='%23000'/><rect x='24' y='6' width='4' height='20' fill='%23000'/><rect x='8' y='6' width='6' height='4' fill='%23000'/><rect x='18' y='6' width='6' height='4' fill='%23000'/><rect x='8' y='14' width='6' height='4' fill='%23000'/><rect x='18' y='14' width='6' height='4' fill='%23000'/></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta property="og:title" content="MILLO — ARCHIVE" />
  <meta property="og:description" content="Personal music archive. Demos, ideas, finished tracks." />
  <meta property="og:image" content="og-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header id="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-title-block">
          <div class="header-title-row">
            <span class="site-title">MILLO</span>
            <span class="site-sub">ARCHIVE</span>
          </div>
          <div class="header-stats" id="header-stats"></div>
        </div>
      </div>
      <button class="shuffle-radio-btn" id="shuffle-radio-btn">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M1 4h8M6 1l3 3-3 3M15 12H7M10 9l3 3-3 3M1 12h2a4 4 0 0 1 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        RADIO
      </button>
    </div>
  </header>

  <nav id="controls-bar">
    <div id="controls-left">
      <div class="dropdown" id="filter-dropdown">
        <button class="dropdown-btn" id="filter-btn-toggle">
          <span id="filter-label">ALL</span>
          <svg width="8" height="8" viewBox="0 0 8 8"><polygon points="0,2 8,2 4,7" fill="#000"/></svg>
        </button>
        <div class="dropdown-menu" id="filter-menu">
          <button class="dropdown-item active" data-filter="all">ALL</button>
          <button class="dropdown-item" data-filter="demo">DEMOS</button>
          <button class="dropdown-item" data-filter="finished">FINISHED</button>
          <button class="dropdown-item" data-filter="complete">COMPLETE</button>
          <button class="dropdown-item" data-filter="idea">IDEAS</button>
          <button class="dropdown-item" data-filter="starred">STARRED ★</button>
          <button class="dropdown-item dropdown-item-voice" data-filter="voice">VOICE NOTES <span id="voice-count-badge"></span></button>
        </div>
      </div>
      <div class="dropdown" id="sort-dropdown">
        <button class="dropdown-btn" id="sort-btn-toggle">
          <span id="sort-label">NEWEST</span>
          <svg width="8" height="8" viewBox="0 0 8 8"><polygon points="0,2 8,2 4,7" fill="#000"/></svg>
        </button>
        <div class="dropdown-menu" id="sort-menu">
          <button class="dropdown-item active" data-sort="newest">NEWEST</button>
          <button class="dropdown-item" data-sort="oldest">OLDEST</button>
        </div>
      </div>
      <button class="icon-btn" id="search-btn" aria-label="Search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="5" stroke="#000" stroke-width="1.8"/>
          <line x1="10.5" y1="10.5" x2="15" y2="15" stroke="#000" stroke-width="1.8" stroke-linecap="square"/>
        </svg>
      </button>
      <button class="playlists-nav-btn" id="playlists-btn">
        <svg width="12" height="11" viewBox="0 0 16 14" fill="none"><line x1="0" y1="1" x2="10" y2="1" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/><line x1="0" y1="9" x2="7" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/><polygon points="12,4 16,6.5 12,9" fill="currentColor"/></svg>
        LISTS
      </button>
      <button class="edit-mode-btn" id="edit-mode-btn">EDIT</button>
    </div>
  </nav>

  <div id="search-bar" style="display:none">
    <input type="search" id="search-input" placeholder="SEARCH TRACKS..." autocomplete="off" spellcheck="false" />
    <button class="search-clear" id="search-clear" aria-label="Clear">✕</button>
  </div>

  <div id="mass-edit-bar" style="display:none">
    <span class="mass-edit-count" id="mass-edit-count">0 SELECTED</span>
    <div class="mass-edit-tags">
      <span class="mass-edit-label">SET TAG:</span>
      <button class="mass-tag-btn" data-stage="idea">IDEA</button>
      <button class="mass-tag-btn" data-stage="demo">DEMO</button>
      <button class="mass-tag-btn" data-stage="finished">FIN</button>
      <button class="mass-tag-btn" data-stage="complete">COMP</button>
    </div>
    <button class="mass-edit-done" id="mass-edit-done">DONE</button>
  </div>

  <main id="main-content">
    <section id="whats-new" style="display:none">
      <div class="section-label">WHAT'S NEW</div>
      <div id="new-tracks-row"></div>
    </section>
    <div id="loading-state"><span class="loading-text">LOADING...</span></div>
    <div id="empty-state" style="display:none"><span class="loading-text">NO TRACKS FOUND</span></div>
    <div id="voice-list" style="display:none"></div>
    <div id="tracks-grid"></div>
  </main>

  <!-- ══ PLAYER BACKDROP (desktop modal) ═══════════════════════════ -->
  <div id="player-backdrop" class="player-backdrop"></div>

  <!-- ══ PLAYER ════════════════════════════════════════════════════════ -->
  <div id="player-bar">

    <!-- HANDLE — drag to expand on mobile, close on desktop -->
    <div class="player-handle-row">
      <button class="player-handle-btn" id="player-toggle-btn" aria-label="Toggle player">
        <div class="player-handle-notch"></div>
      </button>
      <button class="player-close-btn" id="player-close-btn" aria-label="Close player">✕</button>
    </div>

    <!-- EXPANDED CONTENT — single column, all controls visible -->
    <div class="player-full" id="player-full">

      <!-- Desktop close row (hidden on mobile via CSS) -->
      <div class="player-desktop-close-row">
        <span class="player-desktop-panel-label">NOW PLAYING</span>
        <button class="player-close-btn player-desktop-close-x" id="player-close-btn2" aria-label="Close">✕</button>
      </div>

      <!-- Art + Track info -->
      <div class="player-top-row">
        <canvas id="player-art-canvas" class="player-art-canvas" width="64" height="64"></canvas>
        <div class="player-track-info">
          <div class="player-track-title-row">
            <span class="player-title-lg" id="player-title-lg">SELECT A TRACK</span>
            <button class="player-fav-btn" id="player-fav-btn" aria-label="Favourite">★</button>
          <button class="player-share-btn" id="player-share-btn" aria-label="Share" style="display:none">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="13" cy="3" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="3" cy="8" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="13" cy="13" r="2" stroke="currentColor" stroke-width="1.8"/><line x1="5" y1="9" x2="11" y2="12" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="4" x2="5" y2="7" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
          </div>
          <div class="player-track-meta">
            <span class="player-stage-lg" id="player-stage-lg"></span>
            <span class="player-filename-lg" id="player-filename-lg"></span>
          </div>
          <div class="player-playlist-row" id="player-playlist-row" style="display:none">
            <svg width="9" height="9" viewBox="0 0 16 14" fill="none"><line x1="0" y1="1" x2="10" y2="1" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><line x1="0" y1="9" x2="7" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><polygon points="12,4 16,6.5 12,9" fill="currentColor"/></svg>
            <span id="player-playlist-name"></span>
          </div>
        </div>
      </div>

      <!-- Scrub bar -->
      <div class="player-scrub-section">
        <div class="player-progress-track" id="player-progress-track">
          <div class="player-progress-fill" id="player-progress-fill"></div>
          <div class="player-progress-thumb" id="player-progress-thumb"></div>
        </div>
        <div class="player-time-row">
          <span class="player-time" id="player-time">0:00</span>
          <span class="player-dur" id="player-dur">0:00</span>
        </div>
      </div>

      <!-- Main controls -->
      <div class="player-controls-main">
        <button class="pctrl-btn pctrl-loop" id="btn-loop" aria-label="Loop">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 10a6 6 0 1 0 1.5-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/><polyline points="1,4 3.5,6.5 6,4" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        </button>
        <button class="pctrl-btn pctrl-skip" id="btn-prev" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 12 12"><polygon points="11,1 11,11 1,6" fill="currentColor"/><rect x="0" y="1" width="2" height="10" fill="currentColor"/></svg>
        </button>
        <button class="pctrl-btn pctrl-play" id="btn-play" aria-label="Play/Pause">
          <svg id="icon-play" width="28" height="28" viewBox="0 0 16 16"><polygon points="2,1 2,15 14,8" fill="currentColor"/></svg>
          <svg id="icon-pause" width="28" height="28" viewBox="0 0 16 16" style="display:none"><rect x="1" y="1" width="5" height="14" fill="currentColor"/><rect x="10" y="1" width="5" height="14" fill="currentColor"/></svg>
        </button>
        <button class="pctrl-btn pctrl-skip" id="btn-next" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 12 12"><polygon points="1,1 1,11 11,6" fill="currentColor"/><rect x="10" y="1" width="2" height="10" fill="currentColor"/></svg>
        </button>
        <a class="pctrl-btn pctrl-download" id="download-btn" aria-label="Download" style="display:none">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="8" y1="1" x2="8" y2="11" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/><polyline points="4,8 8,12 12,8" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/><line x1="2" y1="15" x2="14" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>
        </a>
      </div>

      <!-- Tag editor + Volume -->
      <div class="player-utilities">
        <div class="player-tag-row" id="player-tag-row">
          <span class="util-label">TAG</span>
          <button class="tag-edit-btn" data-stage="idea">IDEA</button>
          <button class="tag-edit-btn" data-stage="demo">DEMO</button>
          <button class="tag-edit-btn" data-stage="finished">FINISHED</button>
          <button class="tag-edit-btn" data-stage="complete">COMPLETE</button>
        </div>
        <div class="player-vol-row">
          <span class="util-label">VOL</span>
          <button class="vol-btn" id="vol-down">−</button>
          <input type="range" id="player-volume" class="vol-slider" min="0" max="1" step="0.05" value="1">
          <button class="vol-btn" id="vol-up">+</button>
          <span class="vol-pct" id="vol-pct">100%</span>
        </div>
      </div>

      <!-- Notes + Versions (tabbed) -->
      <div class="player-bottom-section">
        <div class="player-tabs" id="player-tabs">
          <button class="ptab active" data-tab="notes">NOTES</button>
          <button class="ptab" data-tab="versions" id="tab-btn-versions" style="display:none">VERSIONS</button>
          <button class="ptab" data-tab="queue" id="tab-btn-queue">QUEUE</button>
        </div>
        <div class="ptab-panel active" id="tab-notes">
          <textarea id="player-note" class="player-note" placeholder="No note yet. Tap to add one..." disabled></textarea>
          <div class="note-footer">
            <span class="note-status" id="note-status"></span>
          </div>
        </div>
        <div class="ptab-panel" id="tab-versions">
          <div class="player-versions-list" id="player-versions"></div>
          <div class="no-versions-msg" id="no-versions-msg" style="display:none">No other versions.</div>
        </div>
        <div class="ptab-panel" id="tab-queue">
          <div class="player-queue-list" id="player-queue-list"></div>
        </div>
      </div>

    </div><!-- end .player-full -->

    <!-- MINI STRIP — always visible -->
    <div class="player-mini">
      <!-- Mobile: thin progress bar (hidden on desktop) -->
      <div class="player-mini-prog">
        <div class="player-mini-prog-fill" id="player-mini-fill"></div>
      </div>
      <div class="player-mini-row">

        <!-- ZONE 1: Art + track info — click to expand -->
        <div class="player-mini-info" id="player-expand-btn">
          <canvas id="mini-art-canvas" class="mini-art-canvas" width="64" height="64"></canvas>
          <div class="player-mini-text-block">
            <span class="player-title" id="player-title">— SELECT A TRACK —</span>
            <span class="player-stage" id="player-stage"></span>
          </div>
        </div>

        <!-- ZONE 2: Transport + scrubber (desktop only) -->
        <div class="desktop-scrub-zone">
          <div class="desktop-scrub-controls">
            <button class="mini-ctrl" id="mini-btn-prev2" aria-label="Previous">
              <svg width="13" height="13" viewBox="0 0 12 12"><polygon points="11,1 11,11 1,6" fill="#000"/><rect x="0" y="1" width="2" height="10" fill="#000"/></svg>
            </button>
            <button class="mini-ctrl mini-play" id="mini-btn-play2" aria-label="Play">
              <svg class="mini-icon-play2" width="17" height="17" viewBox="0 0 16 16"><polygon points="2,1 2,15 14,8" fill="#000"/></svg>
              <svg class="mini-icon-pause2" width="17" height="17" viewBox="0 0 16 16" style="display:none"><rect x="1" y="1" width="5" height="14" fill="#000"/><rect x="10" y="1" width="5" height="14" fill="#000"/></svg>
            </button>
            <button class="mini-ctrl" id="mini-btn-next2" aria-label="Next">
              <svg width="13" height="13" viewBox="0 0 12 12"><polygon points="1,1 1,11 11,6" fill="#000"/><rect x="10" y="1" width="2" height="10" fill="#000"/></svg>
            </button>
          </div>
          <div class="desktop-scrub-track-wrap">
            <span class="desktop-time" id="desktop-time-cur">0:00</span>
            <div class="player-progress-track" id="desktop-progress-track">
              <div class="player-progress-fill" id="desktop-progress-fill"></div>
              <div class="player-progress-thumb" id="desktop-progress-thumb"></div>
            </div>
            <span class="desktop-time right" id="desktop-time-dur">0:00</span>
          </div>
        </div>

        <!-- ZONE 3: Loop + download + vol slider (desktop only) + mobile play controls -->
        <div class="player-mini-controls">
          <!-- Desktop utilities -->
          <button class="mini-ctrl pctrl-loop" id="mini-btn-loop" aria-label="Loop" title="Loop">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 10a6 6 0 1 0 1.5-4" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><polyline points="1,4 3.5,6.5 6,4" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
          </button>
          <a class="mini-ctrl pctrl-download" id="mini-btn-download" aria-label="Download" title="Download">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><line x1="7" y1="1" x2="7" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><polyline points="4,7 7,10 10,7" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><polyline points="2,12 2,13 12,13 12,12" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
          </a>
          <input type="range" id="mini-vol-slider" class="vol-slider" min="0" max="1" step="0.05" value="1" title="Volume">
          <!-- Mobile-only: prev / play / next -->
          <button class="mini-ctrl mobile-only-ctrl" id="mini-btn-prev" aria-label="Previous">
            <svg width="14" height="14" viewBox="0 0 12 12"><polygon points="11,1 11,11 1,6" fill="#000"/><rect x="0" y="1" width="2" height="10" fill="#000"/></svg>
          </button>
          <button class="mini-ctrl mini-play mobile-only-ctrl" id="mini-btn-play" aria-label="Play">
            <svg id="mini-icon-play" width="18" height="18" viewBox="0 0 16 16"><polygon points="2,1 2,15 14,8" fill="#000"/></svg>
            <svg id="mini-icon-pause" width="18" height="18" viewBox="0 0 16 16" style="display:none"><rect x="1" y="1" width="5" height="14" fill="#000"/><rect x="10" y="1" width="5" height="14" fill="#000"/></svg>
          </button>
          <button class="mini-ctrl mobile-only-ctrl" id="mini-btn-next" aria-label="Next">
            <svg width="14" height="14" viewBox="0 0 12 12"><polygon points="1,1 1,11 11,6" fill="#000"/><rect x="10" y="1" width="2" height="10" fill="#000"/></svg>
          </button>
        </div>

      </div>
    </div>

  </div><!-- end #player-bar -->


  <!-- ══ SONG PAGE OVERLAY ═══════════════════════════════════════════ -->
  <div id="song-page" class="overlay-page" style="display:none">
    <div class="overlay-header">
      <button class="overlay-back-btn" id="song-back-btn">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><polyline points="8,1 3,6 8,11" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
        BACK
      </button>
      <span class="overlay-page-title" id="song-page-title"></span>
      <button class="overlay-share-btn" id="song-share-btn">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="13" cy="3" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="3" cy="8" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="13" cy="13" r="2" stroke="currentColor" stroke-width="1.8"/><line x1="5" y1="9" x2="11" y2="12" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="4" x2="5" y2="7" stroke="currentColor" stroke-width="1.8"/></svg>
        SHARE
      </button>
    </div>
    <div class="overlay-body" id="song-page-body"></div>
  </div>

  <!-- ══ LISTS OVERLAY ══════════════════════════════════════ -->
  <div id="playlists-page" class="overlay-page" style="display:none">
    <div class="overlay-header">
      <button class="overlay-back-btn" id="playlists-back-btn">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><polyline points="8,1 3,6 8,11" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
        BACK
      </button>
      <span class="overlay-page-title">LISTS</span>
      <button class="overlay-action-btn" id="new-playlist-btn">+ NEW</button>
    </div>
    <div class="overlay-body" id="playlists-body"></div>
  </div>

  <!-- ══ LIST DETAIL OVERLAY ════════════════════════════════════ -->
  <div id="playlist-detail-page" class="overlay-page" style="display:none">
    <div class="overlay-header">
      <button class="overlay-back-btn" id="playlist-detail-back-btn">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><polyline points="8,1 3,6 8,11" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
        LISTS
      </button>
      <span class="overlay-page-title" id="playlist-detail-title"></span>
      <button class="pl-play-all-btn" id="playlist-play-all-btn">
        <svg width="11" height="11" viewBox="0 0 16 16"><polygon points="2,1 2,15 14,8" fill="currentColor"/></svg>
        PLAY ALL
      </button>
    </div>
    <div class="pl-stats-bar" id="playlist-stats-bar" style="display:none">
      <span class="pl-stats-count" id="playlist-stats-count"></span>
      <span class="pl-stats-sep">·</span>
      <span class="pl-stats-dur" id="playlist-stats-dur"></span>
    </div>
    <div class="overlay-body" id="playlist-detail-body"></div>

    <!-- Embedded mini player at bottom of playlist -->
    <div class="pl-mini-player" id="pl-mini-player">
      <div class="pl-mini-prog"><div class="pl-mini-prog-fill" id="pl-mini-fill"></div></div>
      <div class="pl-mini-row">
        <div class="pl-mini-info" id="pl-mini-expand-btn">
          <span class="pl-mini-title" id="pl-mini-title">— NOTHING PLAYING —</span>
          <span class="pl-mini-stage" id="pl-mini-stage"></span>
        </div>
        <div class="pl-mini-controls">
          <button class="pl-mini-btn" id="pl-mini-prev">
            <svg width="13" height="13" viewBox="0 0 12 12"><polygon points="11,1 11,11 1,6" fill="currentColor"/><rect x="0" y="1" width="2" height="10" fill="currentColor"/></svg>
          </button>
          <button class="pl-mini-btn pl-mini-play-btn" id="pl-mini-play">
            <svg id="pl-mini-icon-play" width="17" height="17" viewBox="0 0 16 16"><polygon points="2,1 2,15 14,8" fill="currentColor"/></svg>
            <svg id="pl-mini-icon-pause" width="17" height="17" viewBox="0 0 16 16" style="display:none"><rect x="1" y="1" width="5" height="14" fill="currentColor"/><rect x="10" y="1" width="5" height="14" fill="currentColor"/></svg>
          </button>
          <button class="pl-mini-btn" id="pl-mini-next">
            <svg width="13" height="13" viewBox="0 0 12 12"><polygon points="1,1 1,11 11,6" fill="currentColor"/><rect x="10" y="1" width="2" height="10" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
