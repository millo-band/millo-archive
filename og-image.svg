<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FF91AF"/>
  <!-- Pixel M letterform -->
  <g fill="#000" transform="translate(360, 155)">
    <!-- Left pillar -->
    <rect x="0" y="0" width="60" height="320"/>
    <!-- Right pillar -->
    <rect x="420" y="0" width="60" height="320"/>
    <!-- Center pillar -->
    <rect x="210" y="0" width="60" height="320"/>
    <!-- Top left crossbar -->
    <rect x="60" y="0" width="150" height="60"/>
    <!-- Top right crossbar -->
    <rect x="270" y="0" width="150" height="60"/>
    <!-- Mid left crossbar -->
    <rect x="60" y="140" width="150" height="60"/>
    <!-- Mid right crossbar -->
    <rect x="270" y="140" width="150" height="60"/>
  </g>
  <!-- MILLO text label -->
  <text x="600" y="540" font-family="monospace" font-size="28" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="24">ARCHIVE</text>
  <!-- Border frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#000" stroke-width="4"/>
</svg>
